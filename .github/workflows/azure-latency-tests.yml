name: Azure model latency tests

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Resource group holding the per-region Azure OpenAI accounts"
        required: false
        default: "azure-region-monitor-latency"
      samples:
        description: "Samples per region"
        required: false
        default: "5"
      candidate_regions:
        description: "Space-separated regions to scan for regional Standard models"
        required: false
        default: ""
      max_models:
        description: "Maximum number of OpenAI models to auto-deploy per region"
        required: false
        default: "8"
      skip_discovery:
        description: "Skip model discovery/deployment and only probe existing deployments"
        required: false
        type: boolean
        default: false
      deploy_dashboard:
        description: "Deploy this modality snapshot to Azure Static Web Apps"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  azure-latency:
    name: Run Azure regional latency probe
    runs-on: ubuntu-latest
    env:
      AI_LATENCY_SAMPLES: ${{ inputs.samples || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Discover and deploy regional Standard models
        id: discover
        if: ${{ !inputs.skip_discovery }}
        continue-on-error: true
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group || 'azure-region-monitor-latency' }}
          CANDIDATE_REGIONS: ${{ inputs.candidate_regions || 'eastus eastus2 westus westus2 westus3 centralus northcentralus southcentralus swedencentral uksouth francecentral germanywestcentral switzerlandnorth norwayeast polandcentral australiaeast japaneast koreacentral southindia canadaeast southeastasia' }}
          MAX_MODELS: ${{ inputs.max_models || '8' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PROBE_PRINCIPAL_ID_FALLBACK: ${{ vars.AZURE_PROBE_PRINCIPAL_ID }}
        run: |
          set -uo pipefail

          # Resolve the probe principal objectId (best effort; falls back to a repo var).
          PRINCIPAL_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || true)
          if [ -z "$PRINCIPAL_ID" ]; then PRINCIPAL_ID="${PROBE_PRINCIPAL_ID_FALLBACK:-}"; fi

          # Read-only: list the model catalog for each candidate region.
          mkdir -p /tmp/modellists
          for region in $CANDIDATE_REGIONS; do
            az cognitiveservices model list --location "$region" --output json \
              > "/tmp/modellists/$region.json" 2>/dev/null \
              || echo "[]" > "/tmp/modellists/$region.json"
          done

          # Select region-attributable Standard models and write Bicep params.
          MAX_MODELS="$MAX_MODELS" PRINCIPAL_ID="$PRINCIPAL_ID" python - <<'PY'
          import glob
          import json
          import os

          from azure_region_monitor.azure_model_discovery import (
              select_regional_standard_models,
          )

          by_region = {}
          for path in glob.glob("/tmp/modellists/*.json"):
              region = os.path.splitext(os.path.basename(path))[0]
              try:
                  with open(path, encoding="utf-8-sig") as handle:
                      by_region[region] = json.load(handle)
              except Exception:
                  by_region[region] = []

          models = select_regional_standard_models(
              by_region, max_models=int(os.environ.get("MAX_MODELS", "8"))
          )
          parameters = {"models": {"value": models}}
          principal_id = os.environ.get("PRINCIPAL_ID", "")
          if principal_id:
              parameters["probePrincipalId"] = {"value": principal_id}
          params = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": parameters,
          }
          with open("infra/regional-latency/params.json", "w", encoding="utf-8") as handle:
              json.dump(params, handle, indent=2)

          print(f"Discovered {len(models)} regional Standard model(s):")
          for model in models:
              print(f"  {model['name']} {model['version']} -> {', '.join(model['regions'])}")
          PY

          model_count=$(python -c "import json; print(len(json.load(open('infra/regional-latency/params.json'))['parameters']['models']['value']))")
          if [ "$model_count" = "0" ]; then
            echo "No regional Standard models discovered; skipping deployment."
            exit 0
          fi

          # Idempotent incremental deployment. Already-created accounts/deployments are reused.
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/regional-latency/main.bicep \
            --parameters @infra/regional-latency/params.json \
            --name "azwatch-lat-$(date +%Y%m%d%H%M%S)"

      - name: Run Azure regional latency probe
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group || 'azure-region-monitor-latency' }}
        run: |
          mkdir -p data/snapshots data/diffs
          rm -f data/snapshots/latest.json data/diffs/latest.json

          # Discover every model deployment across the per-region Azure OpenAI accounts.
          accounts=$(az cognitiveservices account list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?kind=='OpenAI'].{name:name, region:location, endpoint:properties.endpoint}" \
            --output json)

          targets="[]"
          for account in $(echo "$accounts" | python -c "import json,sys; [print(a['name']) for a in json.load(sys.stdin)]"); do
            deployments=$(az cognitiveservices account deployment list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$account" \
              --query "[].{deployment:name, model:properties.model.name}" \
              --output json)
            targets=$(ACCOUNT="$account" ACCOUNTS="$accounts" DEPLOYMENTS="$deployments" python - "$targets" <<'PY'
          import json, os, sys
          existing = json.loads(sys.argv[1])
          accounts = json.loads(os.environ["ACCOUNTS"])
          deployments = json.loads(os.environ["DEPLOYMENTS"])
          account = next(a for a in accounts if a["name"] == os.environ["ACCOUNT"])
          for d in deployments:
              if d.get("deployment") and account.get("region") and account.get("endpoint"):
                  existing.append({
                      "region": account["region"],
                      "endpoint": account["endpoint"],
                      "deployment": d["deployment"],
                      "model": d.get("model") or d["deployment"],
                  })
          print(json.dumps(existing))
          PY
          )
          done
          export AI_LATENCY_TARGETS="$targets"

          export AZURE_OPENAI_TOKEN=$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken --output tsv)

          region_args=()
          while read -r region; do
            [ -n "$region" ] && region_args+=(--region "$region")
          done < <(echo "$AI_LATENCY_TARGETS" | python -c "import json,sys; print('\n'.join(sorted({t['region'] for t in json.load(sys.stdin)})))")

          azure-region-monitor run --probe ai-model-latency-cli "${region_args[@]}" \
            --output data/snapshots/latest.json

      - name: Upload synthetic data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azure-region-monitor-ai-latency
          path: |
            data/snapshots/latest.json
            data/diffs/latest.json
          if-no-files-found: warn

      - name: Azure logout
        if: always()
        run: az logout || true

  deploy-dashboard:
    name: Deploy dashboard
    if: inputs.deploy_dashboard || github.event_name == 'schedule'
    needs: azure-latency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Prepare synthetic data directory
        run: |
          rm -rf data/snapshots data/diffs
          mkdir -p data

      - name: Download synthetic data artifacts
        uses: actions/download-artifact@v4
        with:
          name: azure-region-monitor-ai-latency
          path: data

      - name: Merge existing dashboard snapshot
        env:
          EXISTING_SNAPSHOT_URL: "https://azwatch.operator.lat/api/latest.json"
        run: |
          azure-region-monitor merge-snapshot \
            --base-url "$EXISTING_SNAPSHOT_URL" \
            --overlay data/snapshots/latest.json \
            --output data/snapshots/latest.json

      - name: Update snapshot history
        env:
          HISTORY_BASE_URL: "https://azwatch.operator.lat/api/history"
        run: |
          azure-region-monitor update-history \
            --snapshot data/snapshots/latest.json \
            --history-dir data/history \
            --base-url "$HISTORY_BASE_URL"

      - name: Build static site
        run: azure-region-monitor build-static --output public

      - name: Deploy Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true
