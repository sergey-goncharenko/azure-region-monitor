name: AKS extension regional tests

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated Azure regions to test"
        required: false
        default: ""
      previous_snapshot:
        description: "Optional path to a previous snapshot in the repository for diff generation"
        required: false
        default: ""
      deploy_dashboard:
        description: "Deploy this modality snapshot to Azure Static Web Apps"
        required: false
        type: boolean
        default: false
      azure_cli_timeout_seconds:
        description: "Maximum seconds to wait for each Azure CLI extension catalog command"
        required: false
        default: "120"

permissions:
  contents: read
  id-token: write
  models: read

jobs:
  aks-extensions:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "aks-extension-catalog-cli"
      regions: ${{ inputs.regions || '' }}
      previous_snapshot: ${{ inputs.previous_snapshot || '' }}
      azure_cli_timeout_seconds: ${{ inputs.azure_cli_timeout_seconds || '120' }}
      install_k8s_extension: true
      artifact_name: "azure-region-monitor-aks-extensions"
      deploy_dashboard: ${{ inputs.deploy_dashboard || false }}
      existing_snapshot_url: ${{ inputs.deploy_dashboard && 'https://azwatch.operator.lat/api/latest.json' || '' }}
    secrets: inherit