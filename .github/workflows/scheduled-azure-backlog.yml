name: Scheduled Azure backlog

on:
  schedule:
    # GitHub schedules are UTC. 07:00 UTC is fixed 09:00 EET.
    - cron: "0 7 * * *"
  repository_dispatch:
    types: [azure-byok-pr-rework]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate Azure BYOK tasks without starting agents, branches, or draft PRs"
        required: false
        type: boolean
        default: false
      force:
        description: "Replace an existing task branch when safe"
        required: false
        type: boolean
        default: false
      target_issue:
        description: "Optional issue number for a targeted rework run; use with force after leaving PR review feedback"
        required: false
        type: string
        default: ""
      max_issues:
        description: "Maximum issue sessions for this run"
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: scheduled-azure-backlog
  cancel-in-progress: false

jobs:
  process-backlog:
    name: Process Azure-funded backlog
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Install pinned GitHub Copilot CLI
        run: |
          npm install --global @github/copilot@1.0.70
          copilot --version

      - name: Fetch eligible GitHub backlog issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label azure-backlog \
            --limit 100 \
            --json number,title,body,labels,url > "$RUNNER_TEMP/azure-backlog-issues.json"

      - name: Build bounded Azure BYOK task manifest
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [[ ! "$TARGET_ISSUE" =~ ^[1-9][0-9]*$ ]] || \
               [[ ! "$REWORK_PR" =~ ^[1-9][0-9]*$ ]] || \
               [[ ! "$REWORK_STATUS_COMMENT_ID" =~ ^[1-9][0-9]*$ ]] || \
               [[ ! "$REWORK_REQUEST_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] || \
               [[ ! "$REWORK_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
              echo "Malformed automated PR rework dispatch metadata." >&2
              exit 2
            fi
            case "$REWORK_TRIGGER" in
              slash-command|request-changes) ;;
              *)
                echo "Unsupported automated PR rework trigger." >&2
                exit 2
                ;;
            esac
          fi

          args=(
            --issues "$RUNNER_TEMP/azure-backlog-issues.json"
            --repository "$GITHUB_REPOSITORY"
            --max-issues "$MAX_ISSUES"
            --output "$RUNNER_TEMP/azure-byok-task-manifest.json"
          )
          if [ -n "${TARGET_ISSUE:-}" ]; then
            if [[ ! "$TARGET_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
              echo "target_issue must be a positive integer." >&2
              exit 2
            fi
            args+=(--target-issue "$TARGET_ISSUE")
          fi
          python scripts/run_azure_backlog_cycle.py "${args[@]}" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_ISSUE: ${{ github.event.client_payload.target_issue || inputs.target_issue || '' }}
          EVENT_NAME: ${{ github.event_name }}
          REWORK_PR: ${{ github.event.client_payload.rework_pr || '' }}
          REWORK_STATUS_COMMENT_ID: ${{ github.event.client_payload.rework_status_comment_id || '' }}
          REWORK_REQUEST_ID: ${{ github.event.client_payload.rework_request_id || '' }}
          REWORK_TRIGGER: ${{ github.event.client_payload.rework_trigger || '' }}
          REWORK_ACTOR: ${{ github.event.client_payload.rework_actor || '' }}
          MAX_ISSUES: ${{ inputs.max_issues || '1' }}

      - name: Run Azure BYOK Copilot tasks and open bounded draft PRs
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE: ${{ github.event_name == 'repository_dispatch' || inputs.force }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
          REWORK_PR: ${{ github.event.client_payload.rework_pr || '' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_COPILOT_DEPLOYMENT || vars.AZURE_OPENAI_DEPLOYMENT }}
          COPILOT_BYOK_MODEL_ID: ${{ vars.COPILOT_BYOK_MODEL_ID || 'gpt-5.4-mini' }}
          BYOK_AGENT_TIMEOUT_SECONDS: "2400"
          BYOK_AGENT_INTERRUPT_GRACE_SECONDS: "30"
          BYOK_MAX_AUTOPILOT_CONTINUES: "3"
          BYOK_TASK_COOLDOWN_SECONDS: "65"
          BYOK_AUDIT_DIR: ${{ runner.temp }}/byok-audit
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" != "true" ] && { [ -z "${AZURE_OPENAI_API_KEY:-}" ] || [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_DEPLOYMENT:-}" ]; }; then
            echo "Missing Azure OpenAI BYOK configuration. Set AZURE_OPENAI_KEY plus AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_DEPLOYMENT." >&2
            exit 2
          fi

          manifest_path="$RUNNER_TEMP/azure-byok-task-manifest.json"
          python - "$manifest_path" "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          output = Path(sys.argv[2])
          for index, task in enumerate(manifest["tasks"]):
              (output / f"azure-byok-task-{index}.json").write_text(
                  json.dumps(task), encoding="utf-8"
              )
          PY

          shopt -s nullglob
          failures=0
          task_paths=("$RUNNER_TEMP"/azure-byok-task-[0-9]*.json)
          for index in "${!task_paths[@]}"; do
            task_path="${task_paths[$index]}"
            args=(
              --task "$task_path"
              --base-branch "$BASE_BRANCH"
            )
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            if [ "$FORCE" = "true" ]; then
              args+=(--force)
            fi
            if [ -n "${REWORK_PR:-}" ]; then
              args+=(--require-pr "$REWORK_PR")
            fi
            if ! python scripts/run_azure_byok_task.py "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
              failures=1
            fi
            if [ "$DRY_RUN" != "true" ] && [ "$index" -lt "$(( ${#task_paths[@]} - 1 ))" ]; then
              echo "Waiting ${BYOK_TASK_COOLDOWN_SECONDS}s for Azure BYOK TPM capacity before the next task." | tee -a "$GITHUB_STEP_SUMMARY"
              sleep "$BYOK_TASK_COOLDOWN_SECONDS"
            fi
          done
          exit "$failures"

      - name: Upload sanitized BYOK chats and usage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-byok-chat-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/byok-audit/*-chat.md
            ${{ runner.temp }}/byok-audit/*-metadata.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Finalize automated PR rework status
        if: ${{ always() && github.event_name == 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.rework_pr }}
          STATUS_COMMENT_ID: ${{ github.event.client_payload.rework_status_comment_id }}
          REQUEST_ID: ${{ github.event.client_payload.rework_request_id }}
          REWORK_OUTCOME: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/manage_azure_pr_rework.py finalize-status \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --comment-id "$STATUS_COMMENT_ID" \
            --request-id "$REQUEST_ID" \
            --outcome "$REWORK_OUTCOME" \
            --run-url "$RUN_URL"
