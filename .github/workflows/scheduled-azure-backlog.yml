name: Scheduled Azure backlog

on:
  schedule:
    # GitHub schedules are UTC. 07:00 UTC is fixed 09:00 EET.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate Azure proposals without creating branches or draft PRs"
        required: false
        type: boolean
        default: false
      force:
        description: "Replace an existing proposal branch when safe"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-azure-backlog
  cancel-in-progress: false

jobs:
  process-backlog:
    name: Process Azure-funded backlog
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Generate bounded Azure backlog proposals
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          set -euo pipefail

          if [ -z "${AZURE_OPENAI_API_KEY:-}" ] || [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_DEPLOYMENT:-}" ]; then
            echo "Missing Azure OpenAI configuration. Set AZURE_OPENAI_KEY plus AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_DEPLOYMENT." >&2
            exit 2
          fi

          python scripts/run_azure_backlog_cycle.py \
            --snapshot-url "https://azwatch.operator.lat/api/latest.json" \
            --output "$RUNNER_TEMP/azure-backlog-cycle.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate, branch, and open bounded draft PRs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cycle_path="$RUNNER_TEMP/azure-backlog-cycle.json"
          python - "$cycle_path" "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path

          cycle = json.load(open(sys.argv[1], encoding="utf-8"))
          output = Path(sys.argv[2])
          for index, item in enumerate(cycle["proposals"]):
              proposal = dict(item["proposal"])
              proposal["_kind"] = item["kind"]
              (output / f"azure-backlog-proposal-{index}.json").write_text(
                  json.dumps(proposal), encoding="utf-8"
              )
          PY

          shopt -s nullglob
          failures=0
          for proposal_path in "$RUNNER_TEMP"/azure-backlog-proposal-*.json; do
            kind="$(python - "$proposal_path" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["_kind"])
          PY
            )"
            case "$kind" in
              unknowns) branch_prefix="azure-unknowns" ;;
              goal) branch_prefix="azure-goals" ;;
              docs) branch_prefix="azure-docs" ;;
              *)
                echo "Unknown backlog proposal kind: $kind" >&2
                failures=1
                continue
                ;;
            esac

            args=(
              --proposal "$proposal_path"
              --branch-prefix "$branch_prefix"
              --base-branch "$BASE_BRANCH"
            )
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            if [ "$FORCE" = "true" ]; then
              args+=(--force)
            fi
            if ! python scripts/apply_azure_proposal.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"; then
              failures=1
            fi
          done
          exit "$failures"
