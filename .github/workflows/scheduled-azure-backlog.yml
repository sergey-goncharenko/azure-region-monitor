name: Scheduled Azure backlog

on:
  schedule:
    # GitHub schedules are UTC. 07:00 UTC is fixed 09:00 EET.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate Azure BYOK tasks without starting agents, branches, or draft PRs"
        required: false
        type: boolean
        default: false
      force:
        description: "Replace an existing task branch when safe"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: scheduled-azure-backlog
  cancel-in-progress: false

jobs:
  process-backlog:
    name: Process Azure-funded backlog
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Install pinned GitHub Copilot CLI
        run: |
          npm install --global @github/copilot@1.0.70
          copilot --version

      - name: Fetch eligible GitHub backlog issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label azure-backlog \
            --limit 100 \
            --json number,title,body,labels,url > "$RUNNER_TEMP/azure-backlog-issues.json"

      - name: Build bounded Azure BYOK task manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python scripts/run_azure_backlog_cycle.py \
            --issues "$RUNNER_TEMP/azure-backlog-issues.json" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/azure-byok-task-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Azure BYOK Copilot tasks and open bounded draft PRs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_COPILOT_DEPLOYMENT || vars.AZURE_OPENAI_DEPLOYMENT }}
          COPILOT_BYOK_MODEL_ID: ${{ vars.COPILOT_BYOK_MODEL_ID || 'gpt-5.4-mini' }}
          BYOK_TASK_COOLDOWN_SECONDS: "65"
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" != "true" ] && { [ -z "${AZURE_OPENAI_API_KEY:-}" ] || [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_DEPLOYMENT:-}" ]; }; then
            echo "Missing Azure OpenAI BYOK configuration. Set AZURE_OPENAI_KEY plus AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_DEPLOYMENT." >&2
            exit 2
          fi

          manifest_path="$RUNNER_TEMP/azure-byok-task-manifest.json"
          python - "$manifest_path" "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          output = Path(sys.argv[2])
          for index, task in enumerate(manifest["tasks"]):
              (output / f"azure-byok-task-{index}.json").write_text(
                  json.dumps(task), encoding="utf-8"
              )
          PY

          shopt -s nullglob
          failures=0
          task_paths=("$RUNNER_TEMP"/azure-byok-task-[0-9]*.json)
          for index in "${!task_paths[@]}"; do
            task_path="${task_paths[$index]}"
            args=(
              --task "$task_path"
              --base-branch "$BASE_BRANCH"
            )
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            if [ "$FORCE" = "true" ]; then
              args+=(--force)
            fi
            if ! python scripts/run_azure_byok_task.py "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
              failures=1
            fi
            if [ "$DRY_RUN" != "true" ] && [ "$index" -lt "$(( ${#task_paths[@]} - 1 ))" ]; then
              echo "Waiting ${BYOK_TASK_COOLDOWN_SECONDS}s for Azure BYOK TPM capacity before the next task." | tee -a "$GITHUB_STEP_SUMMARY"
              sleep "$BYOK_TASK_COOLDOWN_SECONDS"
            fi
          done
          exit "$failures"
