name: Agentic PR rework status

# The rework runner is a gh-aw workflow, whose custom jobs cannot depend on its
# generated safe_outputs job. This follower closes the status comment instead.
on:
  workflow_run:
    workflows: ["Agentic PR rework"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: agentic-pr-rework-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize the agentic rework status comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted finalizer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download rework status identifiers
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name agentic-rework-status \
            --dir "$RUNNER_TEMP/rework-status"; then
            echo "No rework status artifact was published; nothing to finalize."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Finalize the rework status comment
        if: ${{ steps.download.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/rework-status/status.json"
          pr_number="$(jq -r '.pr_number // ""' "$status_file")"
          comment_id="$(jq -r '.comment_id // ""' "$status_file")"
          request_id="$(jq -r '.request_id // ""' "$status_file")"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "$comment_id" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "$request_id" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            echo "Malformed agentic rework status identifiers." >&2
            exit 2
          fi
          case "$RUN_CONCLUSION" in
            success) outcome=success ;;
            cancelled) outcome=cancelled ;;
            *) outcome=failure ;;
          esac
          python scripts/manage_azure_pr_rework.py finalize-status \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$pr_number" \
            --comment-id "$comment_id" \
            --request-id "$request_id" \
            --outcome "$outcome" \
            --run-url "$RUN_URL"
