name: Regional probe runner

on:
  workflow_call:
    inputs:
      probes:
        description: "Comma-separated probe names to run"
        required: true
        type: string
      regions:
        description: "Comma-separated Azure regions to test"
        required: false
        type: string
        default: ""
      previous_snapshot:
        description: "Optional path to a previous snapshot in the repository for diff generation"
        required: false
        type: string
        default: ""
      aks_kubernetes_version_prefixes:
        description: "Comma-separated AKS Kubernetes minor versions to check"
        required: false
        type: string
        default: "1.32,1.33,1.34,1.35"
      vm_skus:
        description: "Comma-separated Azure VM SKUs to check, or 'all' for every listed SKU"
        required: false
        type: string
        default: "all"
      function_runtime_features:
        description: "Comma-separated Azure Functions feature=runtime pairs to check"
        required: false
        type: string
        default: ""
      ai_model_features:
        description: "Comma-separated Azure AI feature=model[@version] pairs, or 'all'"
        required: false
        type: string
        default: "all"
      model_latency_models:
        description: "Comma-separated model-latency feature=model pairs, or blank for defaults"
        required: false
        type: string
        default: ""
      model_latency_samples:
        description: "Samples per model for the model-latency probe"
        required: false
        type: string
        default: "5"
      container_apps_resource_features:
        description: "Comma-separated Container Apps feature=resourceType pairs to check"
        required: false
        type: string
        default: ""
      azure_cli_timeout_seconds:
        description: "Maximum seconds to wait for each Azure CLI probe command"
        required: false
        type: string
        default: "45"
      install_k8s_extension:
        description: "Install or update the Azure k8s-extension CLI extension"
        required: false
        type: boolean
        default: false
      azure_login:
        description: "Log in to Azure before running probes (disable for probes that do not use Azure)"
        required: false
        type: boolean
        default: true
      discover_regions:
        description: "Discover physical Azure regions from az account list-locations (auto-adds new regions)"
        required: false
        type: boolean
        default: false
      artifact_name:
        description: "Name for uploaded synthetic data artifacts"
        required: false
        type: string
        default: "azure-region-monitor-synthetic-data"
      deploy_dashboard:
        description: "Deploy the resulting static dashboard to Azure Static Web Apps"
        required: false
        type: boolean
        default: false
      existing_snapshot_url:
        description: "Optional existing dashboard snapshot URL to merge with before deploying"
        required: false
        type: string
        default: ""
      history_base_url:
        description: "Existing dashboard history API URL to preserve before deploying"
        required: false
        type: string
        default: "https://azwatch.operator.lat/api/history"

permissions:
  contents: read
  id-token: write
  models: read

jobs:
  run-probes:
    name: Run regional probes
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_DATE: ${{ github.run_id }}
      AKS_KUBERNETES_VERSION_PREFIXES: ${{ inputs.aks_kubernetes_version_prefixes }}
      AZURE_VM_SKUS: ${{ inputs.vm_skus }}
      FUNCTION_RUNTIME_FEATURES: ${{ inputs.function_runtime_features }}
      AI_MODEL_FEATURES: ${{ inputs.ai_model_features }}
      MODEL_LATENCY_MODELS: ${{ inputs.model_latency_models }}
      MODEL_LATENCY_SAMPLES: ${{ inputs.model_latency_samples }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || github.token }}
      CONTAINER_APPS_RESOURCE_FEATURES: ${{ inputs.container_apps_resource_features }}
      AZURE_CLI_TIMEOUT_SECONDS: ${{ inputs.azure_cli_timeout_seconds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        if: inputs.azure_login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Install Azure CLI extension
        if: inputs.install_k8s_extension
        run: az extension add --name k8s-extension --upgrade

      - name: Discover physical Azure regions
        id: discover_regions
        if: inputs.discover_regions && inputs.azure_login && inputs.regions == ''
        shell: bash
        run: |
          set -uo pipefail
          # List every physical (deployable) region so brand-new regions are covered
          # automatically. Logical groupings (asia, europe, ...) are filtered out. On
          # any failure we emit nothing and the probe falls back to DEFAULT_REGIONS.
          locations="$(az account list-locations --output json 2>/dev/null || echo '[]')"
          regions="$(echo "$locations" | python -c "import json,sys; from azure_region_monitor.region_discovery import select_physical_regions; print(','.join(select_physical_regions(json.load(sys.stdin))))" 2>/dev/null || echo '')"
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Discovered $(echo "$regions" | awk -F, '{print NF}') physical region(s)."

      - name: Run selected probes
        shell: bash
        env:
          SELECTED_PROBES: ${{ inputs.probes }}
          SELECTED_REGIONS: ${{ inputs.regions || steps.discover_regions.outputs.regions || '' }}
        run: |
          mkdir -p data/snapshots data/diffs
          rm -f data/snapshots/latest.json data/diffs/latest.json

          probe_args=()
          IFS=',' read -ra probes <<< "$SELECTED_PROBES"
          for probe in "${probes[@]}"; do
            trimmed="$(echo "$probe" | xargs)"
            if [ -n "$trimmed" ]; then
              probe_args+=(--probe "$trimmed")
            fi
          done

          region_args=()
          IFS=',' read -ra regions <<< "$SELECTED_REGIONS"
          for region in "${regions[@]}"; do
            trimmed="$(echo "$region" | xargs)"
            if [ -n "$trimmed" ]; then
              region_args+=(--region "$trimmed")
            fi
          done

          # With no regions here, azure-region-monitor falls back to DEFAULT_REGIONS.
          azure-region-monitor run "${probe_args[@]}" "${region_args[@]}" --output data/snapshots/latest.json

      - name: Build diff when previous snapshot is provided
        run: |
          previous_snapshot="${{ inputs.previous_snapshot }}"
          if [ -n "$previous_snapshot" ] && [ -f "$previous_snapshot" ]; then
            azure-region-monitor diff \
              "$previous_snapshot" \
              data/snapshots/latest.json \
              --output data/diffs/latest.json
          else
            echo "No previous snapshot path was provided; skipping diff generation."
          fi

      - name: Upload synthetic data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            data/snapshots/latest.json
            data/diffs/latest.json
          if-no-files-found: warn

      - name: Azure logout
        if: always() && inputs.azure_login
        run: az logout || true

  deploy-dashboard:
    name: Deploy dashboard
    if: inputs.deploy_dashboard
    needs: run-probes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Prepare synthetic data directory
        run: |
          rm -rf data/snapshots data/diffs
          mkdir -p data

      - name: Download synthetic data artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: data

      - name: Merge existing dashboard snapshot
        if: inputs.existing_snapshot_url != ''
        env:
          EXISTING_SNAPSHOT_URL: ${{ inputs.existing_snapshot_url }}
        run: |
          azure-region-monitor merge-snapshot \
            --base-url "$EXISTING_SNAPSHOT_URL" \
            --overlay data/snapshots/latest.json \
            --output data/snapshots/latest.json

      - name: Update snapshot history
        env:
          HISTORY_BASE_URL: ${{ inputs.history_base_url }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || github.token }}
        run: |
          azure-region-monitor update-history \
            --snapshot data/snapshots/latest.json \
            --history-dir data/history \
            --base-url "$HISTORY_BASE_URL"

      - name: Build static site
        run: azure-region-monitor build-static --output public

      - name: Report static site size
        run: |
          du -sh public
          find public -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Deploy Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true