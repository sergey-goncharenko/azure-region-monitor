name: Agentic backlog outcome

# The scheduled agentic lane is a gh-aw workflow, whose custom jobs cannot depend on
# its generated safe_outputs job, so it cannot observe its own result. This follower
# records the outcome against the source issue and pauses an issue that keeps failing
# the publication gate, which otherwise gets re-selected every day.
on:
  workflow_run:
    workflows: ["Scheduled agentic backlog"]
    types: [completed]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: agentic-backlog-outcome-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  record:
    name: Record the agentic run outcome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted follower code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the selected issue
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name agentic-backlog-selection \
            --dir "$RUNNER_TEMP/selection"; then
            echo "No issue was selected for that run; nothing to record."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_number="$(jq -r '.issue_number // ""' "$RUNNER_TEMP/selection/selection.json")"
          if [[ ! "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Malformed agentic backlog selection metadata." >&2
            exit 2
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Decide the outcome record
        id: decide
        if: ${{ steps.download.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.download.outputs.issue_number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            > "$RUNNER_TEMP/issue-metadata.json"
          gh api \
            --paginate \
            --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            > "$RUNNER_TEMP/issue-comment-pages.json"
          jq -n \
            --slurpfile issue "$RUNNER_TEMP/issue-metadata.json" \
            --slurpfile pages "$RUNNER_TEMP/issue-comment-pages.json" \
            '{
              number: $issue[0].number,
              labels: $issue[0].labels,
              comments: ($pages[0] | add // [])
            }' > "$RUNNER_TEMP/issue.json"
          case "$RUN_CONCLUSION" in
            success|failure|cancelled|skipped) outcome="$RUN_CONCLUSION" ;;
            *) outcome=failure ;;
          esac
          python scripts/record_azure_agentic_outcome.py \
            --issue "$RUNNER_TEMP/issue.json" \
            --outcome "$outcome" \
            --run-url "$RUN_URL" \
            --github-output "$GITHUB_OUTPUT" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the outcome record
        if: ${{ steps.decide.outputs.action != '' && steps.decide.outputs.action != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.download.outputs.issue_number }}
          COMMENT_ID: ${{ steps.decide.outputs.comment_id }}
          BODY_B64: ${{ steps.decide.outputs.body_b64 }}
          SHOULD_PAUSE: ${{ steps.decide.outputs.pause }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_B64" | base64 --decode > "$RUNNER_TEMP/outcome-body.md"
          if [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              -F body=@"$RUNNER_TEMP/outcome-body.md" > /dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/outcome-body.md" > /dev/null
          fi
          if [ "$SHOULD_PAUSE" = "true" ]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label azure-paused
            echo "Labelled issue #$ISSUE_NUMBER azure-paused." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Quality findings no longer block publication, so they have to reach the reviewer
      # on the pull request itself.
      - name: Publish advisory validation on the generated pull request
        if: ${{ steps.download.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.download.outputs.issue_number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if ! gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name agentic-validation \
            --dir "$RUNNER_TEMP/validation"; then
            echo "That run produced no candidate patch; there is nothing to report."
            exit 0
          fi
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,headRefName,headRefOid > "$RUNNER_TEMP/pulls.json"
          selector='^agentic/issue-'"$ISSUE_NUMBER"'(-[0-9a-f]+)?$'
          pr_number="$(jq -r --arg re "$selector" \
            'map(select(.headRefName | test($re))) | last | .number // ""' \
            "$RUNNER_TEMP/pulls.json")"
          if [ -z "$pr_number" ]; then
            echo "No open agentic pull request for issue #$ISSUE_NUMBER."
            exit 0
          fi
          head_sha="$(jq -r --arg re "$selector" \
            'map(select(.headRefName | test($re))) | last | .headRefOid // ""' \
            "$RUNNER_TEMP/pulls.json")"
          head_ref="$(jq -r --arg re "$selector" \
            'map(select(.headRefName | test($re))) | last | .headRefName // ""' \
            "$RUNNER_TEMP/pulls.json")"
          check_status="$(jq -r '.check_status // ""' \
            "$RUNNER_TEMP/validation/validation.json")"
          if [[ ! "$check_status" =~ ^[0-9]+$ ]] || \
             [[ ! "$head_ref" =~ ^agentic/issue-[1-9][0-9]*(-[0-9a-f]{6,32})?$ ]]; then
            echo "Malformed agentic validation metadata." >&2
            exit 2
          fi
          comment_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" \
            --paginate \
            --jq '[.[] | select(.body | startswith("<!-- azure-agentic-validation -->")) | .id] | last // ""')"
          if [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F body=@"$RUNNER_TEMP/validation/validation.md" > /dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" \
              -F body=@"$RUNNER_TEMP/validation/validation.md" > /dev/null
          fi
          if [ -n "$head_sha" ]; then
            # A check run can conclude `neutral`; a commit status cannot, and a red cross
            # made advisory findings look like a broken build.
            jq -n \
              --arg sha "$head_sha" \
              --arg url "$RUN_URL" \
              --slurpfile v "$RUNNER_TEMP/validation/validation.json" \
              '{
                 name: "agentic/validation",
                 head_sha: $sha,
                 status: "completed",
                 conclusion: $v[0].conclusion,
                 details_url: $url,
                 output: { title: $v[0].title, summary: $v[0].summary }
               }' > "$RUNNER_TEMP/check-run.json"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/check-runs" \
              --input "$RUNNER_TEMP/check-run.json" > /dev/null
          fi
          review_count="$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews?per_page=100" \
            --paginate \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED" and .user.login == "github-actions[bot]")] | length')"
          check_title="$(jq -r '.title // "Validation status unavailable"' \
            "$RUNNER_TEMP/validation/validation.json")"
          if [ "$review_count" -gt 0 ]; then
            review_status="Generated REQUEST_CHANGES review pending"
          else
            review_status="No generated REQUEST_CHANGES review"
          fi
          cat > "$RUNNER_TEMP/source-issue-review.md" <<EOF
          <!-- azure-agentic-draft-review -->
          ## Agentic draft ready for review

          - Draft PR: #$pr_number
          - Canonical validation: $check_title
          - Review status: $review_status

          Review the PR validation comment and any generated request-changes review before marking the draft ready. Ordinary comments on this issue are included in a later scheduled attempt and do not start a run.
          EOF
          issue_comment_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --paginate \
            --jq '[.[] | select(.body | startswith("<!-- azure-agentic-draft-review -->")) | .id] | last // ""')"
          if [[ "$issue_comment_id" =~ ^[1-9][0-9]*$ ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$issue_comment_id" \
              -F body=@"$RUNNER_TEMP/source-issue-review.md" > /dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/source-issue-review.md" > /dev/null
          fi
          echo "Published advisory validation on PR #$pr_number." >> "$GITHUB_STEP_SUMMARY"
# Findings remain on the draft; this follower never dispatches another agent run.
