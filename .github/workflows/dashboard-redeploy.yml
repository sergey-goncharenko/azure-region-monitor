name: Dashboard redeploy

on:
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: "Snapshot JSON URL to render"
        required: false
        default: "https://gray-island-09dc9e703.7.azurestaticapps.net/api/latest.json"

permissions:
  contents: read

jobs:
  deploy-dashboard:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Fetch existing snapshot
        env:
          SNAPSHOT_URL: ${{ inputs.snapshot_url }}
        run: |
          mkdir -p data/snapshots data/diffs
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path

          url = os.environ["SNAPSHOT_URL"]
          target = Path("data/snapshots/latest.json")
          with urllib.request.urlopen(url, timeout=60) as response:
              target.write_bytes(response.read())
          print(f"Fetched {url} to {target}")
          PY

      - name: Build static site
        run: azure-region-monitor build-static --output public

      - name: Deploy Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true
