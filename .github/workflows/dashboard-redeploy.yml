name: Dashboard redeploy

on:
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: "Snapshot JSON URL; default follows durable archive when enabled"
        required: false
        default: "https://azwatch.operator.lat/api/latest.json"
      history_base_url:
        description: "History API URL; default follows durable archive when enabled"
        required: false
        default: "https://azwatch.operator.lat/api/history"
      update_history:
        description: "Store the fetched snapshot as today's history entry"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dashboard:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    concurrency:
      group: dashboard-publication
      cancel-in-progress: false
    env:
      AZWATCH_ARCHIVE_BASE_URL: ${{ vars.AZWATCH_ARCHIVE_BASE_URL }}
      AZWATCH_ARCHIVE_BOOTSTRAP: ${{ vars.AZWATCH_ARCHIVE_BOOTSTRAP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Resolve recoverable publication sources
        id: sources
        env:
          SNAPSHOT_URL: ${{ inputs.snapshot_url }}
          HISTORY_BASE_URL: ${{ inputs.history_base_url }}
        run: |
          args=()
          if [ "$SNAPSHOT_URL" != "https://azwatch.operator.lat/api/latest.json" ]; then
            args+=(--snapshot-override)
          fi
          if [ "$HISTORY_BASE_URL" != "https://azwatch.operator.lat/api/history" ]; then
            args+=(--history-override)
          fi
          python scripts/archive_publication.py sources \
            --snapshot-url "$SNAPSHOT_URL" --history-url "$HISTORY_BASE_URL" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Fetch existing snapshot
        id: snapshot
        env:
          SNAPSHOT_URL: ${{ steps.sources.outputs.snapshot_url }}
        run: |
          mkdir -p data/snapshots data/diffs
          python - <<'PY'
          import gzip
          import os
          import time
          import urllib.request
          from pathlib import Path

          url = os.environ["SNAPSHOT_URL"]
          target = Path("data/snapshots/latest.json")
          last_error = None
          for attempt in range(4):
              try:
                  request = urllib.request.Request(url, headers={"Accept-Encoding": "gzip"})
                  with urllib.request.urlopen(request, timeout=120) as response:
                      payload = response.read()
                      if response.headers.get("Content-Encoding") == "gzip":
                          payload = gzip.decompress(payload)
                  target.write_bytes(payload)
                  print(f"Fetched {url} to {target} ({len(payload)} bytes)")
                  break
              except Exception as error:  # retried below
                  last_error = error
                  print(f"Attempt {attempt + 1} failed: {error}")
                  time.sleep(2 ** attempt)
          else:
              raise SystemExit(f"Failed to fetch {url}: {last_error}")
          PY

      - name: Fetch existing history
        id: history-fetch
        if: ${{ !inputs.update_history }}
        env:
          HISTORY_BASE_URL: ${{ steps.sources.outputs.history_url }}
        run: azure-region-monitor fetch-history --base-url "$HISTORY_BASE_URL" --output data/history --require-existing

      - name: Update snapshot history
        id: history-update
        if: ${{ inputs.update_history }}
        env:
          HISTORY_BASE_URL: ${{ steps.sources.outputs.history_url }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AI_SUMMARY_MAX_TOKENS: "900"
        run: |
          azure-region-monitor update-history \
            --snapshot data/snapshots/latest.json \
            --history-dir data/history \
            --base-url "$HISTORY_BASE_URL" \
            --require-existing

      - name: Publish dashboard with recovery and capacity safeguards
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: ./.github/actions/publish-dashboard
        with:
          history-ready: ${{ steps.history-fetch.outcome == 'success' || steps.history-update.outcome == 'success' }}
          archive-base-url: ${{ steps.sources.outputs.archive_base_url }}
          swa-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Draft social posts
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AI_SOCIAL_MAX_TOKENS: "1200"
        run: |
          set -o pipefail
          azure-region-monitor social-drafts --history data/history \
            | tee "$RUNNER_TEMP/social-post-drafts.md" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Retain social post drafts
        uses: actions/upload-artifact@v4
        with:
          name: social-post-drafts
          path: ${{ runner.temp }}/social-post-drafts.md
          if-no-files-found: error
          retention-days: 30
