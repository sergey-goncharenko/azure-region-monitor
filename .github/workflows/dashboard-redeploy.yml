name: Dashboard redeploy

on:
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: "Snapshot JSON URL to render"
        required: false
        default: "https://azwatch.operator.lat/api/latest.json"
      history_base_url:
        description: "Existing dashboard history API URL to preserve"
        required: false
        default: "https://azwatch.operator.lat/api/history"
      update_history:
        description: "Store the fetched snapshot as today's history entry"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-dashboard:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Fetch existing snapshot
        env:
          SNAPSHOT_URL: ${{ inputs.snapshot_url }}
        run: |
          mkdir -p data/snapshots data/diffs
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path

          url = os.environ["SNAPSHOT_URL"]
          target = Path("data/snapshots/latest.json")
          with urllib.request.urlopen(url, timeout=60) as response:
              target.write_bytes(response.read())
          print(f"Fetched {url} to {target}")
          PY

      - name: Fetch existing history
        if: ${{ !inputs.update_history }}
        env:
          HISTORY_BASE_URL: ${{ inputs.history_base_url }}
        run: azure-region-monitor fetch-history --base-url "$HISTORY_BASE_URL" --output data/history

      - name: Update snapshot history
        if: ${{ inputs.update_history }}
        env:
          HISTORY_BASE_URL: ${{ inputs.history_base_url }}
        run: |
          azure-region-monitor update-history \
            --snapshot data/snapshots/latest.json \
            --history-dir data/history \
            --base-url "$HISTORY_BASE_URL"

      - name: Build static site
        run: azure-region-monitor build-static --output public

      - name: Report static site size
        run: |
          du -sh public
          find public -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Deploy Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true
