name: VM SKU regional tests

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated Azure regions to test"
        required: false
        default: ""
      previous_snapshot:
        description: "Optional path to a previous snapshot in the repository for diff generation"
        required: false
        default: ""
      vm_skus:
        description: "Comma-separated Azure VM SKUs to check, or 'all' for every listed SKU"
        required: false
        default: "all"
      deploy_dashboard:
        description: "Deploy this modality snapshot to Azure Static Web Apps"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  vm-skus:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "vm-sku-cli"
      regions: ${{ inputs.regions || '' }}
      previous_snapshot: ${{ inputs.previous_snapshot || '' }}
      vm_skus: ${{ inputs.vm_skus || 'all' }}
      artifact_name: "azure-region-monitor-vm-skus"
      deploy_dashboard: ${{ inputs.deploy_dashboard || false }}
      existing_snapshot_url: ${{ inputs.deploy_dashboard && 'https://azwatch.operator.lat/api/latest.json' || '' }}
    secrets: inherit