name: Synthetic regional tests

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated Azure regions to test"
        required: false
        default: ""
      previous_snapshot:
        description: "Optional path to a previous snapshot in the repository for diff generation"
        required: false
        default: ""
      aks_kubernetes_version_prefixes:
        description: "Comma-separated AKS Kubernetes minor versions to check"
        required: false
        default: "1.32,1.33,1.34,1.35"
      vm_skus:
        description: "Comma-separated Azure VM SKUs to check, or 'all' for every listed SKU"
        required: false
        default: "all"
      function_runtime_features:
        description: "Comma-separated Azure Functions feature=runtime pairs to check"
        required: false
        default: ""
      ai_model_features:
        description: "Comma-separated Azure AI feature=model[@version] pairs, or 'all'"
        required: false
        default: "all"
      container_apps_resource_features:
        description: "Comma-separated Container Apps feature=resourceType pairs to check"
        required: false
        default: ""
      azure_cli_timeout_seconds:
        description: "Maximum seconds to wait for each Azure CLI probe command"
        required: false
        default: "120"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  all-modalities:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "aks-extension-catalog-cli,aks-version-cli,function-flex-cli,ai-model-catalog-cli,container-apps-provider-cli,vm-sku-cli"
      regions: ${{ inputs.regions || '' }}
      previous_snapshot: ${{ inputs.previous_snapshot || '' }}
      aks_kubernetes_version_prefixes: ${{ inputs.aks_kubernetes_version_prefixes || '1.32,1.33,1.34,1.35' }}
      function_runtime_features: ${{ inputs.function_runtime_features || '' }}
      ai_model_features: ${{ inputs.ai_model_features || 'all' }}
      container_apps_resource_features: ${{ inputs.container_apps_resource_features || '' }}
      vm_skus: ${{ inputs.vm_skus || 'all' }}
      azure_cli_timeout_seconds: ${{ inputs.azure_cli_timeout_seconds || '120' }}
      install_k8s_extension: true
      artifact_name: "azure-region-monitor-synthetic-data"
      deploy_dashboard: true
    secrets: inherit