name: Synthetic regional tests

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated Azure regions to test"
        required: false
        default: "eastus,eastus2,westus3,westeurope,northeurope,swedencentral,uksouth,germanywestcentral,southeastasia,australiaeast"
      previous_snapshot:
        description: "Optional path to a previous snapshot in the repository for diff generation"
        required: false
        default: ""
      aks_kubernetes_version_prefixes:
        description: "Comma-separated AKS Kubernetes minor versions to check"
        required: false
        default: "1.32,1.33,1.34,1.35"
      vm_skus:
        description: "Comma-separated Azure VM SKUs to check"
        required: false
        default: "Standard_B2s,Standard_D2s_v5,Standard_D2as_v5,Standard_E2s_v5"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  all-modalities:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "aks-extension-catalog-cli,aks-version-cli,vm-sku-cli"
      regions: ${{ inputs.regions || 'eastus,eastus2,westus3,westeurope,northeurope,swedencentral,uksouth,germanywestcentral,southeastasia,australiaeast' }}
      previous_snapshot: ${{ inputs.previous_snapshot || '' }}
      aks_kubernetes_version_prefixes: ${{ inputs.aks_kubernetes_version_prefixes || '1.32,1.33,1.34,1.35' }}
      vm_skus: ${{ inputs.vm_skus || 'Standard_B2s,Standard_D2s_v5,Standard_D2as_v5,Standard_E2s_v5' }}
      azure_cli_timeout_seconds: "45"
      install_k8s_extension: true
      artifact_name: "azure-region-monitor-synthetic-data"
      deploy_dashboard: true
    secrets: inherit