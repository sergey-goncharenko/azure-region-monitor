name: Scheduled Azure documentation alignment

on:
  schedule:
    # Runs after the 06:23 UTC issue backlog window.
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the documentation manifest without starting Azure BYOK"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: scheduled-azure-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Documentation alignment
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore documentation source checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/documentation-review-state.json
          key: documentation-review-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            documentation-review-v2-

      - name: Check source changes and weekly augmentation cadence
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/prepare_documentation_review.py prepare \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch || 'main' }}" \
            --state "$RUNNER_TEMP/documentation-review-state.json" \
            --plan "$RUNNER_TEMP/documentation-review-plan.json" \
            --result "$RUNNER_TEMP/documentation-review-result.json" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install project dependencies
        if: ${{ steps.gate.outputs.run_agent == 'true' && !inputs.dry_run }}
        run: python -m pip install ".[dev]"

      - name: Install pinned GitHub Copilot CLI
        if: ${{ steps.gate.outputs.run_agent == 'true' && !inputs.dry_run }}
        run: |
          npm install --global @github/copilot@1.0.70
          copilot --version

      - name: Build bounded documentation session
        if: ${{ steps.gate.outputs.run_agent == 'true' }}
        run: |
          set -euo pipefail
          python scripts/run_azure_maintenance_cycle.py \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch || 'main' }}" \
            --session-set docs \
            --source-review "$RUNNER_TEMP/documentation-review-plan.json" \
            --output "$RUNNER_TEMP/azure-maintenance-manifest.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run Azure BYOK documentation session
        id: review
        if: ${{ steps.gate.outputs.run_agent == 'true' && !inputs.dry_run }}
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_COPILOT_DEPLOYMENT || vars.AZURE_OPENAI_DEPLOYMENT }}
          COPILOT_BYOK_MODEL_ID: ${{ vars.COPILOT_BYOK_MODEL_ID || 'gpt-5.4-mini' }}
          BYOK_AGENT_TIMEOUT_SECONDS: "600"
          BYOK_AUDIT_DIR: ${{ runner.temp }}/byok-audit
          BYOK_DOCS_RESULT_PATH: ${{ runner.temp }}/documentation-review-result.json
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" != "true" ] && { [ -z "${AZURE_OPENAI_API_KEY:-}" ] || [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_DEPLOYMENT:-}" ]; }; then
            echo "Missing Azure OpenAI BYOK configuration." >&2
            exit 2
          fi

          python - "$RUNNER_TEMP/azure-maintenance-manifest.json" "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          output = Path(sys.argv[2])
          if len(manifest["tasks"]) != 1 or manifest["tasks"][0].get("kind") != "docs":
              raise SystemExit("Expected exactly one documentation task.")
          (output / "azure-maintenance-docs.json").write_text(
              json.dumps(manifest["tasks"][0]), encoding="utf-8"
          )
          PY

          args=(--task "$RUNNER_TEMP/azure-maintenance-docs.json" --base-branch "$BASE_BRANCH")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/run_azure_byok_task.py "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record documentation source outcome
        id: checkpoint
        if: ${{ always() && !cancelled() && !inputs.dry_run && steps.gate.outcome == 'success' && (steps.gate.outputs.checkpoint == 'true' || steps.review.outcome == 'success' || steps.review.outcome == 'failure') }}
        run: |
          set -euo pipefail
          python scripts/prepare_documentation_review.py complete \
            --repository "$GITHUB_REPOSITORY" \
            --state "$RUNNER_TEMP/documentation-review-state.json" \
            --plan "$RUNNER_TEMP/documentation-review-plan.json" \
            --result "$RUNNER_TEMP/documentation-review-result.json" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save documentation source checkpoint
        if: ${{ always() && steps.checkpoint.outputs.save_state == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/documentation-review-state.json
          key: documentation-review-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload documentation gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: documentation-review-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/documentation-review-plan.json
            ${{ runner.temp }}/documentation-review-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload sanitized documentation chat and usage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-byok-chat-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/byok-audit/*-chat.md
            ${{ runner.temp }}/byok-audit/*-metadata.json
          if-no-files-found: ignore
          retention-days: 30
