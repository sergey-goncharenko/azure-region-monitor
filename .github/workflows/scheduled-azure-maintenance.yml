name: Scheduled Azure documentation alignment

on:
  schedule:
    # Runs after the 07:00 UTC issue backlog window.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the documentation manifest without starting Azure BYOK"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-azure-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Documentation alignment
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Install pinned GitHub Copilot CLI
        run: |
          npm install --global @github/copilot@1.0.70
          copilot --version

      - name: Build bounded documentation session
        run: |
          set -euo pipefail
          python scripts/run_azure_maintenance_cycle.py \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch || 'main' }}" \
            --session-set docs \
            --output "$RUNNER_TEMP/azure-maintenance-manifest.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run Azure BYOK documentation session
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_COPILOT_DEPLOYMENT || vars.AZURE_OPENAI_DEPLOYMENT }}
          COPILOT_BYOK_MODEL_ID: ${{ vars.COPILOT_BYOK_MODEL_ID || 'gpt-5.4-mini' }}
          BYOK_AGENT_TIMEOUT_SECONDS: "600"
          BYOK_AUDIT_DIR: ${{ runner.temp }}/byok-audit
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" != "true" ] && { [ -z "${AZURE_OPENAI_API_KEY:-}" ] || [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_DEPLOYMENT:-}" ]; }; then
            echo "Missing Azure OpenAI BYOK configuration." >&2
            exit 2
          fi

          python - "$RUNNER_TEMP/azure-maintenance-manifest.json" "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          output = Path(sys.argv[2])
          if len(manifest["tasks"]) != 1 or manifest["tasks"][0].get("kind") != "docs":
              raise SystemExit("Expected exactly one documentation task.")
          (output / "azure-maintenance-docs.json").write_text(
              json.dumps(manifest["tasks"][0]), encoding="utf-8"
          )
          PY

          args=(--task "$RUNNER_TEMP/azure-maintenance-docs.json" --base-branch "$BASE_BRANCH")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/run_azure_byok_task.py "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized documentation chat and usage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-byok-chat-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/byok-audit/*-chat.md
            ${{ runner.temp }}/byok-audit/*-metadata.json
          if-no-files-found: ignore
          retention-days: 30
