name: Daily scan

# Single orchestrated daily pipeline. Every modality probe runs as a parallel job
# (stage 1); a single deploy job (stage 2) waits for all of them, merges every
# modality onto the live snapshot, and deploys the dashboard exactly once. This
# replaces the previous three independently-scheduled workflows, which each deployed
# the dashboard and could race or deploy mid-scan.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      deploy_dashboard:
        description: "Deploy the combined dashboard after all probes finish"
        required: false
        type: boolean
        default: true
      include_github_model_latency:
        description: "Run the GitHub Models global latency probe (may consume GitHub Models allowance)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  models: read

# Scheduled dispatch has drifted by up to 12 hours, so a late run can still be
# merging and deploying when the next day fires. Queue instead of overlapping:
# cancelling would abort a deploy midway and leave the live snapshot half-updated.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  aks-extensions:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "aks-extension-catalog-cli"
      discover_regions: true
      install_k8s_extension: true
      # Ignored by the catalog probe, which enforces its own 120-second floor per region.
      azure_cli_timeout_seconds: "30"
      artifact_name: "shard-aks-extensions"
      deploy_dashboard: false
    secrets: inherit

  aks-versions:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "aks-version-cli"
      discover_regions: true
      aks_kubernetes_version_prefixes: "1.32,1.33,1.34,1.35"
      azure_cli_timeout_seconds: "120"
      artifact_name: "shard-aks-versions"
      deploy_dashboard: false
    secrets: inherit

  functions:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "function-flex-cli"
      discover_regions: true
      azure_cli_timeout_seconds: "120"
      artifact_name: "shard-functions"
      deploy_dashboard: false
    secrets: inherit

  ai-models:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "ai-model-catalog-cli"
      discover_regions: true
      ai_model_features: "all"
      azure_cli_timeout_seconds: "120"
      artifact_name: "shard-ai-models"
      deploy_dashboard: false
    secrets: inherit

  container-apps:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "container-apps-provider-cli"
      discover_regions: true
      azure_cli_timeout_seconds: "120"
      artifact_name: "shard-container-apps"
      deploy_dashboard: false
    secrets: inherit

  vm-skus:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "vm-sku-cli"
      discover_regions: true
      vm_skus: "all"
      azure_cli_timeout_seconds: "120"
      artifact_name: "shard-vm-skus"
      deploy_dashboard: false
    secrets: inherit

  model-latency:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.include_github_model_latency) }}
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "model-latency-cli"
      regions: "github-global"
      azure_login: false
      model_latency_models: "auto"
      model_latency_samples: "3"
      artifact_name: "shard-model-latency"
      deploy_dashboard: false
    secrets: inherit

  azure-latency:
    uses: ./.github/workflows/azure-latency-tests.yml
    with:
      deploy_dashboard: false
    secrets: inherit

  deploy-dashboard:
    name: Deploy combined dashboard
    if: ${{ always() && (github.event_name == 'schedule' || inputs.deploy_dashboard) }}
    needs:
      - aks-extensions
      - aks-versions
      - functions
      - ai-models
      - container-apps
      - vm-skus
      - model-latency
      - azure-latency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dashboard-publication
      cancel-in-progress: false
    env:
      AZWATCH_ARCHIVE_BASE_URL: ${{ vars.AZWATCH_ARCHIVE_BASE_URL }}
      AZWATCH_ARCHIVE_BOOTSTRAP: ${{ vars.AZWATCH_ARCHIVE_BOOTSTRAP }}
      AZWATCH_PUBLICATION_MAX_BYTES: ${{ vars.AZWATCH_PUBLICATION_MAX_BYTES }}
      AZWATCH_PUBLICATION_WARN_BYTES: ${{ vars.AZWATCH_PUBLICATION_WARN_BYTES }}
      AZWATCH_PUBLICATION_MAX_FILES: ${{ vars.AZWATCH_PUBLICATION_MAX_FILES }}
      AZWATCH_PUBLICATION_WARN_FILES: ${{ vars.AZWATCH_PUBLICATION_WARN_FILES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Download all modality artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/artifacts

      - name: Resolve recoverable publication sources
        id: sources
        run: |
          python scripts/archive_publication.py sources \
            --snapshot-url "https://azwatch.operator.lat/api/latest.json" \
            --history-url "https://azwatch.operator.lat/api/history" \
            --github-output "$GITHUB_OUTPUT"

      - name: Merge all modalities onto the live snapshot
        id: merge
        env:
          EXISTING_SNAPSHOT_URL: ${{ steps.sources.outputs.snapshot_url }}
        run: |
          set -uo pipefail
          mkdir -p data/snapshots data/history

          # Overlay every modality shard that was produced this run onto the live
          # snapshot. A modality whose probe failed leaves no artifact, so its last
          # good data is carried forward from the live base. Order among distinct
          # modalities does not matter because each overlay only replaces its own
          # modality's features.
          overlays=()
          while IFS= read -r shard; do
            [ -n "$shard" ] && overlays+=(--overlay "$shard")
          done < <(find data/artifacts -type f -name 'latest.json' -not -path '*/diffs/*' | sort)
          echo "Merging ${#overlays[@]} modality shard(s)."

          azure-region-monitor merge-snapshot \
            --base-url "$EXISTING_SNAPSHOT_URL" \
            "${overlays[@]}" \
            --output data/snapshots/latest.json

      - name: Update snapshot history
        id: history
        env:
          HISTORY_BASE_URL: ${{ steps.sources.outputs.history_url }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AI_SUMMARY_MAX_TOKENS: "900"
        run: |
          azure-region-monitor update-history \
            --snapshot data/snapshots/latest.json \
            --history-dir data/history \
            --base-url "$HISTORY_BASE_URL" \
            --require-existing

      - name: Publish dashboard with recovery and capacity safeguards
        if: ${{ always() && steps.merge.outcome == 'success' }}
        uses: ./.github/actions/publish-dashboard
        with:
          history-ready: ${{ steps.history.outcome == 'success' }}
          archive-base-url: ${{ steps.sources.outputs.archive_base_url }}
          swa-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Draft social posts
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AI_SOCIAL_MAX_TOKENS: "1200"
        run: |
          set -o pipefail
          azure-region-monitor social-drafts --history data/history \
            | tee "$RUNNER_TEMP/social-post-drafts.md" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Retain social post drafts
        uses: actions/upload-artifact@v4
        with:
          name: social-post-drafts
          path: ${{ runner.temp }}/social-post-drafts.md
          if-no-files-found: error
          retention-days: 30
