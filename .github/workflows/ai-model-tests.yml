name: Azure AI model regional tests

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated Azure regions to test"
        required: false
        default: ""
      previous_snapshot:
        description: "Optional path to a previous snapshot in the repository for diff generation"
        required: false
        default: ""
      ai_model_features:
        description: "Comma-separated feature=model[@version] pairs, or 'all' for every listed model"
        required: false
        default: "all"
      deploy_dashboard:
        description: "Deploy this modality snapshot to Azure Static Web Apps"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  models: read

jobs:
  ai-models:
    uses: ./.github/workflows/regional-probe-run.yml
    with:
      probes: "ai-model-catalog-cli"
      regions: ${{ inputs.regions || '' }}
      previous_snapshot: ${{ inputs.previous_snapshot || '' }}
      ai_model_features: ${{ inputs.ai_model_features || 'all' }}
      artifact_name: "azure-region-monitor-ai-models"
      deploy_dashboard: ${{ inputs.deploy_dashboard || false }}
      existing_snapshot_url: ${{ inputs.deploy_dashboard && 'https://azwatch.operator.lat/api/latest.json' || '' }}
    secrets: inherit