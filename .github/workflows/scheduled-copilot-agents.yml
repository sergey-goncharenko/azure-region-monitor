name: Manual Copilot agent comparison

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the manual Copilot unknowns prompt without creating an issue"
        required: false
        type: boolean
        default: true
      force:
        description: "Create a new task even if a matching open task already exists"
        required: false
        type: boolean
        default: false
      model:
        description: "Optional Copilot cloud-agent model id; blank uses automatic selection"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: manual-copilot-agent-comparison
  cancel-in-progress: false

jobs:
  start-comparison:
    name: Start manual Copilot comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start manual unknowns session
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          MODEL: ${{ inputs.model || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          args=(
            --session unknowns
            --repo "$GITHUB_REPOSITORY"
            --base-branch "$BASE_BRANCH"
            --snapshot-url "https://azwatch.operator.lat/api/latest.json"
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "$MODEL" ]; then
            args+=(--model "$MODEL")
          fi

          python scripts/start_copilot_agent_sessions.py "${args[@]}"
