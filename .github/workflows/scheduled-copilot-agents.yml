name: Scheduled agent sessions

on:
  schedule:
    # GitHub schedules are UTC. 07:00 UTC is fixed 09:00 EET.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "Which scheduled agent session to start"
        required: false
        type: choice
        default: both
        options:
          - both
          - docs
          - unknowns
      dry_run:
        description: "Print planned prompts without creating issues or PRs"
        required: false
        type: boolean
        default: false
      force:
        description: "Create a new task even if a matching open task already exists"
        required: false
        type: boolean
        default: false
      force_unknowns_without_candidates:
        description: "Run the unknowns agent even when the latest snapshot has no unknown checks"
        required: false
        type: boolean
        default: false
      model:
        description: "Optional Copilot cloud-agent model id for unknowns; blank uses auto selection"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: scheduled-copilot-agent-sessions
  cancel-in-progress: false

jobs:
  start-sessions:
    name: Start scheduled agent sessions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for Azure Codex
        if: ${{ github.event_name == 'schedule' || inputs.session == 'both' || inputs.session == 'docs' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies for Azure Codex
        if: ${{ github.event_name == 'schedule' || inputs.session == 'both' || inputs.session == 'docs' }}
        run: python -m pip install ".[dev]"

      - name: Run Azure Codex documentation alignment
        if: ${{ github.event_name == 'schedule' || inputs.session == 'both' || inputs.session == 'docs' }}
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE: ${{ inputs.force || false }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2025-04-01-preview' }}
        run: |
          set -euo pipefail

          prompt_path="$RUNNER_TEMP/azure-codex-docs-prompt.md"
          pr_body_path="$RUNNER_TEMP/azure-codex-docs-pr.md"
          branch="azure-codex/docs-alignment"

          python scripts/build_azure_codex_docs_prompt.py > "$prompt_path"

          {
            echo "## Azure Codex documentation alignment"
            echo
            echo "Docs alignment now runs through Azure-backed Codex, not the GitHub Copilot cloud-agent issue flow."
            echo
            echo "### Prompt"
            echo
            echo '```markdown'
            cat "$prompt_path"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run requested; skipped Codex execution." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${AZURE_OPENAI_API_KEY:-}" ] || [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_DEPLOYMENT:-}" ]; then
            echo "Missing Azure Codex configuration. Set AZURE_OPENAI_KEY secret plus AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_DEPLOYMENT repository variables." >&2
            exit 2
          fi

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ] && [ "$FORCE" != "true" ]; then
            echo "Skipped Azure Codex docs alignment: PR #$existing_pr is already open for $branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          npm install -g @openai/codex
          codex -p azure exec --full-auto "$(cat "$prompt_path")"

          python -m pytest tests/test_static_site.py tests/test_summary.py tests/test_copilot_agent_sessions.py
          python -m ruff check .

          if git diff --quiet; then
            echo "Azure Codex docs alignment found no repository changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add -A
          git commit -m "docs: refresh monitor docs and agent instructions"
          git push --force-with-lease origin "$branch"

          cat > "$pr_body_path" <<'PR_BODY'
          Azure-backed Codex documentation alignment run.

          Validation:
          - python -m pytest tests/test_static_site.py tests/test_summary.py tests/test_copilot_agent_sessions.py
          - python -m ruff check .
          PR_BODY

          gh pr create \
            --draft \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "docs: refresh monitor docs and agent instructions" \
            --body-file "$pr_body_path"

      - name: Start scheduled sessions
        if: ${{ github.event_name == 'schedule' || inputs.session == 'both' || inputs.session == 'unknowns' }}
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          SESSION: ${{ (github.event_name == 'schedule' || inputs.session == 'both') && 'unknowns' || inputs.session }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE: ${{ inputs.force || false }}
          FORCE_UNKNOWNS_WITHOUT_CANDIDATES: ${{ inputs.force_unknowns_without_candidates || false }}
          MODEL: ${{ inputs.model || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          args=(
            --session "$SESSION"
            --repo "$GITHUB_REPOSITORY"
            --base-branch "$BASE_BRANCH"
            --snapshot-url "https://azwatch.operator.lat/api/latest.json"
          )

          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$FORCE_UNKNOWNS_WITHOUT_CANDIDATES" = "true" ]; then
            args+=(--force-unknowns-without-candidates)
          fi
          if [ -n "$MODEL" ]; then
            args+=(--model "$MODEL")
          fi

          python scripts/start_copilot_agent_sessions.py "${args[@]}"