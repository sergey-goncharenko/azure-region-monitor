name: Azure BYOK PR rework

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: azure-byok-pr-rework-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate and dispatch bounded rework
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted dispatcher code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve event eligibility
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/manage_azure_pr_rework.py resolve \
            --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --actor "$GITHUB_ACTOR" \
            --output "$RUNNER_TEMP/azure-pr-rework.json" \
            --github-output "$GITHUB_OUTPUT" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Acknowledge slash command
        if: ${{ steps.resolve.outputs.eligible == 'true' && steps.resolve.outputs.trigger == 'slash-command' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes \
            > /dev/null || true

      - name: Create rework status
        id: queue
        if: ${{ steps.resolve.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/manage_azure_pr_rework.py queue-status \
            --result "$RUNNER_TEMP/azure-pr-rework.json" \
            --repository "$GITHUB_REPOSITORY" \
            --request-id "$REQUEST_ID" \
            --run-url "$RUN_URL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch targeted Azure BYOK rework
        if: ${{ steps.resolve.outputs.eligible == 'true' }}
        env:
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STATUS_COMMENT_ID: ${{ steps.queue.outputs.comment_id }}
          TARGET_ISSUE: ${{ steps.resolve.outputs.target_issue }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          TRIGGER_KIND: ${{ steps.resolve.outputs.trigger }}
          REQUESTED_BY: ${{ steps.resolve.outputs.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rework_requirements="$(jq -r '.rework_requirements // ""' "$RUNNER_TEMP/azure-pr-rework.json")"
          jq -n \
            --arg target_issue "$TARGET_ISSUE" \
            --arg pr_number "$PR_NUMBER" \
            --arg status_comment_id "$STATUS_COMMENT_ID" \
            --arg request_id "$REQUEST_ID" \
            --arg trigger "$TRIGGER_KIND" \
            --arg actor "$REQUESTED_BY" \
            --arg rework_requirements "$rework_requirements" \
            '{
              event_type: "azure-byok-pr-rework",
              client_payload: {
                target_issue: $target_issue,
                rework_pr: $pr_number,
                rework_status_comment_id: $status_comment_id,
                rework_request_id: $request_id,
                rework_trigger: $trigger,
                rework_actor: $actor,
                rework_requirements: $rework_requirements
              }
            }' > "$RUNNER_TEMP/azure-pr-rework-dispatch.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/azure-pr-rework-dispatch.json"
          echo "Dispatched source issue #$TARGET_ISSUE for PR #$PR_NUMBER." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark dispatch failure
        if: ${{ failure() && steps.queue.outputs.comment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          STATUS_COMMENT_ID: ${{ steps.queue.outputs.comment_id }}
        run: |
          python scripts/manage_azure_pr_rework.py finalize-status \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --comment-id "$STATUS_COMMENT_ID" \
            --request-id "$REQUEST_ID" \
            --outcome dispatch-failed \
            --run-url "$RUN_URL"
