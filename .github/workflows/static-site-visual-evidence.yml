name: Static site visual evidence
run-name: >-
  Visual evidence - ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || inputs.pr_number && format('PR #{0}', inputs.pr_number) || format('{0} smoke check', github.ref_name) }}
on:
  push:
    branches: [main]
    paths:
      - "src/azure_region_monitor/**"
      - "docs/**/*.html"
      - "data/**"
      - "scripts/prepare_visual_evidence.py"
      - "scripts/capture_static_site_evidence.mjs"
      - ".github/workflows/static-site-visual-evidence.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/azure_region_monitor/**"
      - "docs/**/*.html"
      - "data/**"
      - "scripts/prepare_visual_evidence.py"
      - "scripts/capture_static_site_evidence.mjs"
      - ".github/workflows/static-site-visual-evidence.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number; leave blank to smoke-test the selected ref"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: static-site-visual-evidence-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      comparison_mode: ${{ steps.pr.outputs.comparison_mode }}
    steps:
      - name: Resolve exact comparison
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const requested = String(context.payload.inputs?.pr_number || "").trim();
            if (context.eventName === "push" || (context.eventName === "workflow_dispatch" && !requested)) {
              if (!/^[0-9a-f]{40}$/.test(context.sha)) throw new Error("Expected an exact ref commit.");
              core.setOutput("pr_number", "");
              core.setOutput("base_sha", context.sha);
              core.setOutput("head_sha", context.sha);
              core.setOutput("comparison_mode", "reference-smoke");
              return;
            }
            let pr = context.payload.pull_request;
            if (context.eventName === "workflow_dispatch") {
              const number = Number(requested);
              if (!Number.isSafeInteger(number) || number < 1) throw new Error("A positive PR number is required.");
              ({ data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number }));
            }
            if (!pr || pr.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error("The PR must target this repository.");
            }
            for (const ref of [pr.base.sha, pr.head.sha]) {
              if (!/^[0-9a-f]{40}$/.test(ref)) throw new Error("Expected exact commit SHAs.");
            }
            core.setOutput("pr_number", pr.number);
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("comparison_mode", "pr-comparison");

  capture:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_DIR: ${{ github.workspace }}/base
      HEAD_DIR: ${{ github.workspace }}/head
      AI_SUMMARY_ENABLED: "0"
      AI_SOCIAL_ENABLED: "0"
    steps:
      - name: Configure isolated paths
        run: |
          echo "INPUT_DIR=$RUNNER_TEMP/static-site-input" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/static-site-evidence" >> "$GITHUB_ENV"
      - name: Check out capture tooling
        uses: actions/checkout@v4
        with:
          path: workflow
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          path: head
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false
      - name: Check out pull request base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ needs.resolve.outputs.base_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare shared repository inputs
        run: |
          python "$GITHUB_WORKSPACE/workflow/scripts/prepare_visual_evidence.py" \
            --source "$HEAD_DIR/data" --output "$INPUT_DIR"
      - name: Build comparable static sites
        id: builds
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          failed=0
          before_status=failure
          after_status=failure
          # Both revisions read the same immutable fixture, but derive their own schemas.
          for label in before after; do
            source_dir="$BASE_DIR"
            if [ "$label" = after ]; then source_dir="$HEAD_DIR"; fi
            venv="$RUNNER_TEMP/visual-venv-$label"
            if (
              python -m venv "$venv" &&
              "$venv/bin/python" -m pip install "$source_dir" &&
              cd "$source_dir" &&
              PYTHONPATH="" "$venv/bin/python" -m azure_region_monitor.cli build-static \
                --output "$EVIDENCE_DIR/$label-site" \
                --snapshot "$INPUT_DIR/snapshots/latest.json" \
                --diff "$INPUT_DIR/diffs/latest.json" \
                --history "$INPUT_DIR/history"
            ) >"$EVIDENCE_DIR/$label-build.log" 2>&1; then
              if [ "$label" = before ]; then before_status=success; else after_status=success; fi
            else
              failed=1
              echo "::error::The $label revision did not build; see its build log in the evidence artifact."
              cat "$EVIDENCE_DIR/$label-build.log"
            fi
          done
          printf '{"before":"%s","after":"%s"}\n' "$before_status" "$after_status" > "$EVIDENCE_DIR/build-status.json"
          exit "$failed"
      - name: Cache Playwright tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            .cache/static-site-browser/node_modules
          key: ${{ runner.os }}-node22-static-site-visual-evidence-playwright-v1-55-0
      - name: Capture available screenshots
        id: screenshots
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          COMPARISON_MODE: ${{ needs.resolve.outputs.comparison_mode }}
          BUILD_STATUS_FILE: ${{ runner.temp }}/static-site-evidence/build-status.json
        run: |
          set -euo pipefail
          browser_dir="$GITHUB_WORKSPACE/.cache/static-site-browser"
          mkdir -p "$browser_dir"
          if [ ! -f "$browser_dir/node_modules/playwright/package.json" ] || \
             ! grep -q '"version": "1.55.0"' "$browser_dir/node_modules/playwright/package.json"; then
            npm install --prefix "$browser_dir" --no-save playwright@1.55.0
          fi
          npx --prefix "$browser_dir" playwright install --with-deps chromium
          export SNAPSHOT_FILE="$INPUT_DIR/snapshots/latest.json"
          before_pid=""
          after_pid=""
          trap 'kill "$before_pid" "$after_pid" 2>/dev/null || true' EXIT
          for label in before after; do
            if ! jq -e --arg label "$label" '.[$label] == "success"' "$BUILD_STATUS_FILE" >/dev/null; then continue; fi
            port=4173
            if [ "$label" = after ]; then port=4174; fi
            python -m http.server "$port" --bind 127.0.0.1 \
              --directory "$EVIDENCE_DIR/$label-site" >"$EVIDENCE_DIR/$label-server.log" 2>&1 &
            if [ "$label" = before ]; then before_pid=$!; else after_pid=$!; fi
            for _ in $(seq 1 50); do
              if curl --fail --silent "http://127.0.0.1:${port}/index.html" >/dev/null; then break; fi
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/index.html" >/dev/null
          done
          cp "$GITHUB_WORKSPACE/workflow/scripts/capture_static_site_evidence.mjs" "$browser_dir/capture.mjs"
          node "$browser_dir/capture.mjs"
      - name: Upload paired visual evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-site-visual-evidence-${{ needs.resolve.outputs.pr_number && format('pr-{0}', needs.resolve.outputs.pr_number) || format('ref-{0}', github.sha) }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/static-site-evidence/before/*.png
            ${{ runner.temp }}/static-site-evidence/after/*.png
            ${{ runner.temp }}/static-site-evidence/manifest.json
            ${{ runner.temp }}/static-site-evidence/index.html
            ${{ runner.temp }}/static-site-evidence/*-server.log
            ${{ runner.temp }}/static-site-evidence/*-build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Link visual evidence artifact
        if: ${{ always() && steps.evidence.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf '\n[Download visual evidence, comparison index, and diagnostic logs](%s)\n' \
            "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failed build or capture result
        if: ${{ !cancelled() && (steps.builds.outcome == 'failure' || steps.screenshots.outcome == 'failure') }}
        run: |
          echo "::error::Visual evidence is incomplete. Available screenshots and diagnostic logs were retained; this is not a successful comparison."
          exit 1
