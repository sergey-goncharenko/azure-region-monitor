<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Historical Azure regional evidence</title>
  <script src="/assets/archive-browser.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Historical Azure regional evidence</h1><a href="/">Current dashboard</a></header>
    <p id="archive-status" role="status">Loading the complete archive...</p>
    <p>Recorded status and comparison dates are preserved. Archive unavailability is not evidence of an Azure provider change.</p>
    <noscript>JavaScript is required to browse archived dates here. Historical JSON remains available through the history API.</noscript>
    <ul id="archive-days"></ul>
    <button id="archive-previous" type="button" hidden>Previous dates</button>
    <button id="archive-next" type="button" hidden>Next dates</button>
    <button id="archive-retry" type="button" hidden>Retry</button>
  </main>
</body>
</html>
